name: adan_mobprog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  material_ui: any
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/assets/images/
    - assets/assets/icons/
  fonts:
    - family: Klavika
      fonts:
        - asset: assets/assets/fonts/KlavikaBoldBold.otf
    - family: Frutiger
      fonts: 
        - asset: assets/assets/fonts/FrutigerLTStd-Roman.otf
  uses-material-design: true